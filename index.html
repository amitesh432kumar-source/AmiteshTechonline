<style>

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:16px/1.65 var(--sans);color:var(--ink);background:var(--bg);overflow-x:hidden;

.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.links{display:flex;gap:2px;align-items:center}

#burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:1.4rem;padding:4px 12px;cursor:pointer}

  nav.links a{padding:13px 14px;border-radius:12px}
}

.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.navy{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid var(--line)}.btn.navy:hover{background:rgba(255,255,255,.16)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.28);color:#fff;box-shadow:none}.btn.ghost:hover{border-color:var(--gold-b);color:var(--gold-b)}
.btn.wa{background:#1fa855;color:#fff;box-shadow:0 6px 22px rgba(31,168,85,.3)}

.term .p{color:var(--gold-b)}.term .a{color:#7dd3fc}.term .d{color:#8ea2c7}
.term .cur{display:inline-block;width:8px;height:1em;background:var(--gold-b);vertical-align:-2px;animation:blink 1s steps(1) infinite}

.step{padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);position:relative}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--grad);color:var(--navy-d);font:700 1.1rem var(--serif);margin-bottom:12px}

.cc{display:flex;flex-direction:column;transition:.25s}

.modal .x{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--muted)}

.qr svg,.qr img{width:220px;height:220px}
.qr p{color:#44506b}
.timer{font:700 1.4rem var(--serif);color:var(--gold-b)}
.timer.low{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12284a;border:1px solid var(--line);color:#fff;padding:12px 22px;border-radius:14px;z-index:90;max-width:90vw;box-shadow:var(--sh);font-weight:500}
.toast.err{background:#5a1612;border-color:rgba(255,90,80,.4)}
.notice{background:rgba(224,184,76,.1);border:1px solid rgba(224,184,76,.35);padding:14px 18px;border-radius:14px;font-size:.93rem;color:#f3e3b0}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;-webkit-overflow-scrolling:touch}
.tabs button{background:none;border:0;padding:11px 16px;font:600 .94rem var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--gold-b);border-color:var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}
.lessonrow{display:grid;grid-template-columns:1fr;gap:6px;border:1px dashed rgba(255,255,255,.2);border-radius:12px;padding:10px;margin-bottom:8px}

/* community */
.post{padding:20px;margin-bottom:16px}
.post.pin{border-color:rgba(224,184,76,.55);box-shadow:0 0 0 1px rgba(224,184,76,.25),0 0 40px rgba(224,184,76,.08)}
.post img.pi{border-radius:12px;margin:12px 0;max-height:360px;object-fit:cover;width:100%}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:pointer;font:600 .9rem var(--sans);color:#dbe5f8}
.act button:hover{border-color:var(--gold)}
.heart.on{color:#ff5c93}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.heart.pop span{display:inline-block;animation:pop .35s}
.cm{border-top:1px solid var(--line);padding:9px 0}
footer{border-top:1px solid var(--line);background:rgba(3,8,18,.8);color:var(--muted);padding:32px 0;margin-top:64px;font-size:.92rem}
footer a{color:var(--gold-b)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

async function initFirebase() {

  try {

    const app = appM.initializeApp(CONFIG.firebase);
    fb = { auth: authM.getAuth(app), m: authM };

  } catch (e) { console.warn("Firebase failed", e); S.authReady = true; }
}

function openRegister() {

    if (!/^[6-9]\d{9}$/.test(f.phone.replace(/[\s-]/g, "").replace(/^\+?91/, ""))) return toast("Enter a valid 10-digit mobile number", true);
    m.close();

let ppSdk = null;
function loadPayPal(cfg) {
  if (window.paypal) return Promise.resolve(window.paypal);
  return ppSdk ||= new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.client_id)}&currency=${encodeURIComponent(cfg.currency)}&components=buttons&enable-funding=card`;
    sc.onload = () => window.paypal ? ok(window.paypal) : no(new Error("PayPal failed to load")); sc.onerror = () => { ppSdk = null; no(new Error("PayPal failed to load")); };
    document.head.appendChild(sc);
  });
}
function payWindow({ title, amount, note, save, waText, pp }) {
  const upi = S.settings.upi || {};
  const link = upi.id ? `upi://pay?pa=${encodeURIComponent(upi.id)}&pn=${encodeURIComponent(upi.name || "Amitesh Tech")}&am=${amount}&cu=INR&tn=${encodeURIComponent(note || "Amitesh Tech")}` : "";
  const m = modal(`
    <h2>Pay ${rs(amount)}</h2><p class="muted small" style="margin-top:-6px">${esc(title)}</p>
    <div class="row sp"><span class="small muted">Complete payment within</span><span class="timer" id="tm">5:00</span></div>
    ${pp ? `<div id="ppw" style="margin:12px 0"><div class="small muted" style="margin-bottom:6px">Pay with PayPal, debit card or credit card</div><div id="ppb"></div></div>` : ""}
    <div class="qr" id="qr" style="margin:12px 0" aria-label="UPI QR code"></div>
    ${link ? `<p class="center small muted" style="margin:0 0 10px">Scan with any UPI app, or</p><div class="center"><a class="btn navy" href="${esc(link)}">Pay in my UPI app</a></div>` : ""}
    <p class="small muted">Some UPI apps may warn about or ignore the pre-filled amount. Please make sure you pay exactly <b>${rs(amount)}</b>.</p>
    <button class="btn wa" id="paid" style="width:100%">I have paid. Send screenshot on WhatsApp</button>`);
  const qr = $("#qr", m);
  if (pp) api("paypal_config").then(async cfg => {
    if (!cfg.enabled) return $("#ppw", m)?.remove();
    const pay = await loadPayPal(cfg);
    pay.Buttons({
      createOrder: async () => (await api("paypal_order", pp)).id,
      onApprove: async d => {
        await api("paypal_capture", { order_id: d.orderID }); clearInterval(iv); await syncMe();
        $(".mb", m).innerHTML = `<h2>Payment successful ✅</h2><p>Thank you! Your payment was received and your access is unlocked.</p>`; route();
      },
      onError: e => toast(e?.message || "PayPal payment failed", true)
    }).render("#ppb");
  }).catch(e => { const w = $("#ppw", m); if (w) w.innerHTML = `<p class="small muted">PayPal is unavailable right now (${esc(e.message)}). Use UPI below.</p>`; });
  if (link) {
    import("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm").then(mod => {
      const gen = mod.default || mod; const q = gen(0, "M"); q.addData(link); q.make(); qr.innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    }).catch(() => qr.innerHTML = `<p class="muted center">Could not draw QR. Use the “Pay in my UPI app” button.</p>`);
  } else if (safeUrl(S.settings.qr_image)) qr.innerHTML = `<img alt="UPI QR code" src="${esc(S.settings.qr_image)}">`;
  else qr.innerHTML = `<p class="muted center">Payment details are not set yet. Please contact us on WhatsApp.</p>`;
  let left = 300; const tm = $("#tm", m);
  const iv = setInterval(() => {
    left--; tm.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; tm.classList.toggle("low", left < 60);
    if (left <= 0) { clearInterval(iv); $("#paid", m).disabled = true; qr.innerHTML = `<p class="center muted">Time is over. Please start again.</p>`; }
  }, 1000);
  m.onclose = () => clearInterval(iv);
  $("#paid", m).onclick = e => busy(e.target, async () => {
    await save(); clearInterval(iv);
    const url = waLink(waText);
    $(".mb", m).innerHTML = `<h2>Almost done ✅</h2><p>Your request is saved. Now send your payment screenshot on WhatsApp to <b>+91 ${wa().slice(-10).replace(/(\d{5})(\d{5})/, "$1 $2")}</b>. We verify it manually and then unlock your access.</p><a class="btn wa" target="_blank" rel="noopener" href="${esc(url)}" style="width:100%">Open WhatsApp</a>`;
    window.open(url, "_blank", "noopener"); route();
  });
}

function itemAction(kind, it) {

  if (pendingFor(kind, it.id)) return `<span class="chip gold">Waiting for admin approval</span>`;
  return it.is_paid ? `<button class="btn sm" data-buy="${kind}:${it.id}">Buy ${rs(priceAfter(it))}</button>` : `<button class="btn sm" data-buy="${kind}:${it.id}">Enrol free</button>`;
}
function wireItems(app) {
  $$("[data-open]", app).forEach(b => b.onclick = () => openContent(...b.dataset.open.split(":")));
  $$("[data-buy]", app).forEach(b => b.onclick = () => buy(...b.dataset.buy.split(":")));
}
async function buy(kind, id) {
  if (!loggedIn()) return needLogin();
  const it = (kind === "course" ? S.courses : S.classes).find(x => x.id === id); if (!it) return;
  const amount = priceAfter(it);
  if (amount === 0) { try { await api("purchase", { kind, id }); await syncMe(); toast("Enrolled ✅"); route(); } catch (e) { toast(e.message, true); } return; }
  payWindow({
    title: it.title, amount, note: it.title.slice(0, 40),
    pp: { type: "purchase", kind, id },
    save: async () => { await api("purchase", { kind, id }); await syncMe(); },
    waText: `Hello Amitesh Tech, I have paid for "${it.title}".\nName: ${S.me?.registration?.name || S.user.displayName || ""}\nEmail: ${S.user.email}\nAmount: ${rs(amount)}\nScreenshot attached.`
  });
}

async function toggleComments(id, btn) {
  const box = $("#c-" + id);
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  const load = async () => {
    const r = await api("comments", { post_id: id });
    box.innerHTML = `${r.comments.map(c => `<div class="cm"><b>${esc(c.name)}</b> <span class="muted small">${esc(fmtDate(c.created_at))}</span>${c.mine || S.me.admin ? ` <a href="#" data-del="${c.id}" class="small">delete</a>` : ""}<div>${nl(c.body)}</div></div>`).join("") || `<p class="muted small">No comments yet.</p>`}
      <form class="row" style="margin-top:8px;flex-wrap:nowrap"><input maxlength="1000" placeholder="Write a comment…" aria-label="Comment" required><button class="btn sm">Send</button></form>`;
    $("b", btn).textContent = r.comments.length;
    $$("[data-del]", box).forEach(a => a.onclick = async e => { e.preventDefault(); try { await api("delete_comment", { id: a.dataset.del }); load(); } catch (x) { toast(x.message, true); } });
    $("form", box).onsubmit = async e => { e.preventDefault(); const i = $("input", e.target); try { await api("add_comment", { post_id: id, body: i.value }); load(); } catch (x) { toast(x.message, true); } };
  };
  try { await load(); } catch (e) { toast(e.message, true); }
}

/* generic form modal */
function formModal(title, fields, vals, onSave) {
  const html = fields.map(f => {
    const id = "f_" + f.k, v = vals[f.k] ?? f.def ?? "";
    if (f.t === "check") return `<label><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${f.l}</label>`;
    if (f.t === "area") return `<label for="${id}">${f.l}</label><textarea id="${id}" ${f.max ? `maxlength="${f.max}"` : ""}>${esc(v)}</textarea>`;
    if (f.t === "select") return `<label for="${id}">${f.l}</label><select id="${id}">${f.o.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    if (f.t === "image") return `<label for="${id}">${f.l}</label><input id="${id}" value="${esc(v)}" placeholder="https://… or upload below"><input type="file" accept="image/*" data-up="${id}" style="margin-top:6px"><div class="small muted" id="${id}_s"></div>`;
    return `<label for="${id}">${f.l}</label><input id="${id}" type="${f.t || "text"}" value="${esc(v)}" ${f.max ? `maxlength="${f.max}"` : ""} ${f.ph ? `placeholder="${esc(f.ph)}"` : ""}>`;
  }).join("");
  const m = modal(`<h2>${esc(title)}</h2><div id="ff">${html}</div><div class="row sp" style="margin-top:18px"><button class="btn ghost" id="cn">Cancel</button><button class="btn" id="sv">Save</button></div>`, true);
  $$("[data-up]", m).forEach(i => i.onchange = async () => { $("#" + i.dataset.up + "_s", m).textContent = "Uploading…"; try { $("#" + i.dataset.up, m).value = await uploadImage(i.files[0]); $("#" + i.dataset.up + "_s", m).textContent = "Uploaded ✅"; } catch (e) { $("#" + i.dataset.up + "_s", m).textContent = e.message; } });
  $("#cn", m).onclick = m.close;
  $("#sv", m).onclick = e => busy(e.target, async () => {
    const out = {}; for (const f of fields) { const el = $("#f_" + f.k, m); out[f.k] = f.t === "check" ? el.checked : el.value; }
    await onSave(out); m.close(); await reloadAdmin(); toast("Saved ✅");
  });
  return m;
}
async function uploadImage(file) {
  if (!file) throw new Error("No file");
  const bmp = await createImageBitmap(file).catch(() => null);
  let blob = file, type = file.type;
  if (bmp && file.type !== "image/gif") { // shrink big photos so uploads stay fast on mobile data
    const k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height)); const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); blob = await new Promise(r => c.toBlob(r, "image/jpeg", .85)); type = "image/jpeg";
  }
  if (blob.size > 5 * 1024 * 1024) throw new Error("Image must be under 5 MB");
  const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
  return (await api("upload", { type, data })).url;
}

function courseForm(c) {
  const lessons = (c.lessons || []).map(l => ({ title: l.title, kind: l.kind, url: l.url }));
  const m = formModal(c.id ? "Edit course" : "New course", [
    { k: "title", l: "Title", max: 150 }, { k: "description", l: "Description", t: "area", max: 3000 }, { k: "instructor", l: "Instructor", max: 100 },
    { k: "thumbnail", l: "Thumbnail", t: "image" }, { k: "is_paid", l: "Paid course", t: "check" }, { k: "price", l: "Price (₹, before discount)", t: "number" }, { k: "published", l: "Published", t: "check" }
  ], c, async v => {
    syncLessons();
    await api("save_course", { ...v, id: c.id, price: Number(v.price) || 0, lessons });
  });
  const box = document.createElement("div");
  box.innerHTML = `<h3 style="margin-top:20px">Lessons (<span id="lc">0</span>/200)</h3><div id="ll"></div><button class="btn sm ghost" id="la" type="button">+ Add lesson</button>`;
  $("#ff", m).append(box);
  const draw = () => {
    $("#lc", m).textContent = lessons.length;
    $("#ll", m).innerHTML = lessons.map((l, i) => `<div class="lessonrow" data-i="${i}"><input class="lt" placeholder="Lesson title" value="${esc(l.title)}" aria-label="Lesson title"><input class="lu" placeholder="Video link (https://…)" value="${esc(l.url)}" aria-label="Lesson link">
      <div class="row"><label style="margin:0;font-weight:500"><input type="checkbox" class="lk" ${l.kind === "video" ? "checked" : ""}> uploaded video file</label><input type="file" accept="video/mp4,video/webm" class="lf" style="width:auto;flex:1;min-width:140px"><span class="small muted ls"></span><button type="button" class="btn sm danger lx">Remove</button></div></div>`).join("");
    $$(".lx", m).forEach(b => b.onclick = () => { syncLessons(); lessons.splice(+b.closest(".lessonrow").dataset.i, 1); draw(); });
    $$(".lf", m).forEach(inp => inp.onchange = async () => {
      const row = inp.closest(".lessonrow"), f = inp.files[0], s = $(".ls", row); if (!f) return;
      if (!/^video\/(mp4|webm)$/.test(f.type)) return s.textContent = "mp4 or webm only";
      if (f.size > 50 * 1024 * 1024) return s.textContent = "Max 50 MB";
      try {
        s.textContent = "Uploading…"; const r = await api("signed_upload", { type: f.type, size: f.size });
        const fd = new FormData(); fd.append("cacheControl", "3600"); fd.append("", f);
        const up = await fetch(r.upload_url, { method: "PUT", body: fd, headers: { "x-upsert": "false" } });
        if (!up.ok) throw new Error("Upload failed");
        $(".lu", row).value = r.public_url; $(".lk", row).checked = true; s.textContent = "Uploaded ✅";
      } catch (e) { s.textContent = e.message; }
    });
  };
  function syncLessons() { $$(".lessonrow", m).forEach(r => { const l = lessons[+r.dataset.i]; l.title = $(".lt", r).value; l.url = $(".lu", r).value; l.kind = $(".lk", r).checked ? "video" : "link"; }); }
  $("#la", m).onclick = () => { syncLessons(); if (lessons.length >= 200) return toast("Max 200 lessons", true); lessons.push({ title: "", kind: "link", url: "" }); draw(); };
  draw();
}

  const A = S.A;
  el.innerHTML = `<h3>Testimonials</h3><div class="row" style="margin-bottom:10px"><button class="btn" id="at">+ Add testimonial</button></div>
    ${A.testimonials.map(t => `<div class="item row sp"><div>“${esc(t.text)}”<div class="muted small">${esc(t.name)} · ${esc(t.role)}</div></div><button class="btn sm danger" data-dt="${t.id}">Delete</button></div>`).join("") || `<div class="empty">No testimonials yet. Only add real ones.</div>`}
    <h3 style="margin-top:24px">FAQs</h3><div class="row" style="margin-bottom:10px"><button class="btn" id="af">+ Add FAQ</button></div>
    ${A.faqs.map(f => `<div class="item row sp"><div><b>${esc(f.question)}</b><div class="muted small">${esc(f.answer)}</div></div><button class="btn sm danger" data-df="${f.id}">Delete</button></div>`).join("") || `<div class="empty">No FAQs yet.</div>`}`;
  $("#at", el).onclick = () => formModal("New testimonial", [{ k: "name", l: "Name", max: 80 }, { k: "role", l: "Role (e.g. Student, Delhi)", max: 100 }, { k: "text", l: "Testimonial", t: "area", max: 1000 }], {}, v => api("save_testimonial", v));
  $("#af", el).onclick = () => formModal("New FAQ", [{ k: "question", l: "Question", max: 300 }, { k: "answer", l: "Answer", t: "area", max: 2000 }], {}, v => api("save_faq", v));
  $$("[data-dt]", el).forEach(b => b.onclick = confirmDo("Delete this testimonial?", () => api("delete_testimonial", { id: b.dataset.dt })));
  $$("[data-df]", el).forEach(b => b.onclick = confirmDo("Delete this FAQ?", () => api("delete_faq", { id: b.dataset.df })));
}

/* ----- Settings tab ----- */
function tabSettings(el) {
  const s = S.A.settings, h = S.A.hooks, pp = S.A.paypal || {}; const photos = [...(s.founder?.photos || [])];
  el.innerHTML = `<div class="card pad"><h3>Offer &amp; fee</h3>
    <label for="sd">Discount % (0 to 90)</label><input id="sd" type="number" min="0" max="90" value="${esc(s.discount?.percent ?? 0)}">
    <label for="sdl">Discount label</label><input id="sdl" maxlength="80" value="${esc(s.discount?.label || "")}" placeholder="e.g. Chhath Puja offer">
    <label for="sf">Registration fee (₹, 1 to 100000)</label><input id="sf" type="number" min="1" max="100000" value="${esc(s.fee ?? 499)}">
    <h3 style="margin-top:22px">Payments (UPI)</h3>
    <label for="su">UPI ID</label><input id="su" value="${esc(s.upi?.id || "")}" placeholder="name@bank" autocapitalize="none">
    <label for="sun">Payee name</label><input id="sun" maxlength="60" value="${esc(s.upi?.name || "")}">
    <label for="sq">QR image (used only when no UPI ID is saved)</label><input id="sq" value="${esc(s.qr_image || "")}"><input type="file" accept="image/*" id="sqf" style="margin-top:6px">
    <h3 style="margin-top:22px">Founder</h3>
    <label for="fn">Name</label><input id="fn" maxlength="80" value="${esc(s.founder?.name || "")}">
    <label for="fb">Bio</label><textarea id="fb" maxlength="3000">${esc(s.founder?.bio || "")}</textarea>
    <label>About photos (${photos.length}/5, change every 2 seconds when more than one)</label><div id="ph"></div>
    <input type="file" accept="image/*" id="pf" ${photos.length >= 5 ? "disabled" : ""}><div class="small muted" id="pfs">Add one photo at a time.</div>
    <h3 style="margin-top:22px">Support</h3><label for="sw">WhatsApp number (with country code)</label><input id="sw" inputmode="numeric" value="${esc(s.support?.whatsapp || "")}" placeholder="917250947444">
    <div style="margin-top:20px"><button class="btn" id="ss">Save settings</button></div></div>
    <div class="card pad" style="margin-top:18px"><h3>Automations (optional)</h3>
    <label for="h1">Make.com / n8n webhook (registration &amp; payment events)</label><input id="h1" value="${esc(h.automation)}" placeholder="https://…">
    <label for="h2">Welcome email webhook (Grok automation, receives name and email)</label><input id="h2" value="${esc(h.welcome)}" placeholder="https://…">
    <div style="margin-top:16px"><button class="btn" id="sh">Save webhooks</button></div></div>
    <div class="card pad" style="margin-top:18px"><h3>PayPal credentials</h3>
    <div class="small muted">From developer.paypal.com → Apps &amp; Credentials. The secret is stored privately and never shown again.</div>
    <label for="pm">Mode</label><select id="pm"><option value="sandbox" ${pp.mode !== "live" ? "selected" : ""}>Sandbox (testing)</option><option value="live" ${pp.mode === "live" ? "selected" : ""}>Live</option></select>
    <div class="row" style="gap:12px"><div style="flex:1"><label for="pcu">Currency</label><input id="pcu" maxlength="3" value="${esc(pp.currency || "INR")}" placeholder="INR"></div>
    <div style="flex:1"><label for="prt">Rupees per 1 unit (1 for INR)</label><input id="prt" type="number" step="any" min="0" value="${esc(pp.rate || 1)}"></div></div>
    <label for="pc">Client ID</label><input id="pc" value="${esc(pp.client_id)}" autocomplete="off" placeholder="PayPal Client ID">
    <label for="ps">Client Secret</label><input id="ps" type="password" value="" autocomplete="new-password" placeholder="${pp.has_secret ? "Saved ✓ — leave blank to keep it" : "PayPal Client Secret"}">
    <div style="margin-top:16px"><button class="btn" id="sp">Save PayPal credentials</button></div></div>`;
  const drawPh = () => {
    $("#ph", el).innerHTML = photos.map((u, i) => `<div class="row" style="margin-bottom:6px"><img src="${esc(u)}" alt="" width="56" height="56" style="object-fit:cover;border-radius:8px"><span class="small muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Photo ${i + 1}</span>
      ${i > 0 ? `<button class="btn sm ghost" data-l="${i}">← Move left</button>` : ""}<button class="btn sm danger" data-x="${i}">Remove</button></div>`).join("");
    $$("[data-l]", el).forEach(b => b.onclick = () => { const i = +b.dataset.l; [photos[i - 1], photos[i]] = [photos[i], photos[i - 1]]; drawPh(); });
    $$("[data-x]", el).forEach(b => b.onclick = () => { photos.splice(+b.dataset.x, 1); drawPh(); $("#pf", el).disabled = false; });
  };
  drawPh();
  $("#pf", el).onchange = async e => { const st = $("#pfs", el); try { st.textContent = "Uploading…"; photos.push(await uploadImage(e.target.files[0])); st.textContent = "Added. Press Save settings to keep it."; drawPh(); if (photos.length >= 5) e.target.disabled = true; } catch (x) { st.textContent = x.message; } e.target.value = ""; };
  $("#sqf", el).onchange = async e => { try { $("#sq", el).value = await uploadImage(e.target.files[0]); toast("QR uploaded. Press Save settings."); } catch (x) { toast(x.message, true); } };
  $("#ss", el).onclick = e => busy(e.target, async () => {
    const next = {
      discount: { percent: Number($("#sd", el).value) || 0, label: $("#sdl", el).value }, fee: Number($("#sf", el).value),
      upi: { id: $("#su", el).value.trim(), name: $("#sun", el).value }, qr_image: $("#sq", el).value.trim(),
      founder: { name: $("#fn", el).value, bio: $("#fb", el).value, photos }, support: { whatsapp: $("#sw", el).value }
    };
    const r = await api("save_settings", { settings: next });
    const ok = r.settings?.fee === next.fee && r.settings?.discount?.percent === next.discount.percent && (r.settings?.upi?.id || "") === next.upi.id && (r.settings?.founder?.photos || []).length === photos.length;
    if (!ok) throw new Error("The server did not store these settings. Please try again.");
    await reloadAdmin(); toast("Settings saved and checked ✅");
  });
  $("#sh", el).onclick = e => busy(e.target, async () => {
    const r = await api("set_hooks", { automation: $("#h1", el).value.trim(), welcome: $("#h2", el).value.trim() });
    if (r.hooks?.automation !== $("#h1", el).value.trim() || r.hooks?.welcome !== $("#h2", el).value.trim()) throw new Error("Webhooks were not stored");
    toast("Webhooks saved ✅");
  });
  $("#sp", el).onclick = e => busy(e.target, async () => {
    const r = await api("set_paypal", { client_id: $("#pc", el).value.trim(), client_secret: $("#ps", el).value.trim(), mode: $("#pm", el).value, currency: $("#pcu", el).value.trim(), rate: Number($("#prt", el).value) || 1 });
    if (r.paypal?.client_id !== $("#pc", el).value.trim()) throw new Error("PayPal credentials were not stored");
    await reloadAdmin(); toast("PayPal credentials saved ✅");
  });
}

/* ---------- boot ---------- */
$("#yr").textContent = new Date().getFullYear();
(async () => {
  renderNav(); route();
  await loadPublic(); route();
  await initFirebase(); route();
})();
</script>
</body>
</html>
